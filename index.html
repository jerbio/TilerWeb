<!doctype html>
<html class="dark" lang="en">
	<head>
		<!-- Google tag (gtag.js) -->
		<script
			async
			src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"
		></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag('js', new Date());

			gtag('config', '%VITE_GA_MEASUREMENT_ID%');
		</script>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" href="TilerLogo.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#4F46E5" />

		<!--
			Per-page SEO (title, description, keywords, canonical, Open Graph,
			Twitter, robots, JSON-LD) is managed at runtime by the <SEO> component
			(react-helmet-async) and baked into static HTML for public routes at
			build time by scripts/prerender.mjs. Only global, non-page-specific
			tags belong here so there is a single source of truth and no duplicates.
		-->

		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>

		<title>Tiler - Smart Calendar & Task Management App</title>
	</head>
	<body>
		<div id="root"></div>
		<div id="datepicker-portal"></div>

		<!-- Required for .NET Framework SignalR -->
		<script src="%VITE_BASE_URL%Scripts/jquery-2.1.1.js"></script>
		<script src="%VITE_BASE_URL%Scripts/jquery.signalR-2.4.3.js"></script>
		<script src="%VITE_BASE_URL%signalr/hubs"></script>

		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
