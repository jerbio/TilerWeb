<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <clipPath id="clip"><rect width="860" height="360" rx="16"/></clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#ED123B" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="860" height="360" fill="url(#bg)"/>

    <!-- Column headers -->
    <text x="66" y="48" font-family="Urbanist,Inter,sans-serif" font-size="13" font-weight="700" fill="#d4d4d4">Current</text>
    <text x="256" y="48" font-family="Urbanist,Inter,sans-serif" font-size="13" font-weight="700" fill="#d4d4d4">Request</text>
    <text x="446" y="48" font-family="Urbanist,Inter,sans-serif" font-size="13" font-weight="700" fill="#d4d4d4">Simulated</text>
    <text x="636" y="48" font-family="Urbanist,Inter,sans-serif" font-size="13" font-weight="700" fill="#d4d4d4">Proposed</text>

    <!-- Arrows between columns -->
    <text x="190" y="120" font-family="Inter,sans-serif" font-size="18" fill="#ED123B" text-anchor="middle">&#8594;</text>
    <text x="380" y="120" font-family="Inter,sans-serif" font-size="18" fill="#ED123B" text-anchor="middle">&#8594;</text>
    <text x="570" y="120" font-family="Inter,sans-serif" font-size="18" fill="#ED123B" text-anchor="middle">&#8594;</text>

    <!-- Column 1: current state (overlap conflict) -->
    <rect x="36" y="64" width="196" height="260" rx="14" fill="#111111" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="52" y="88" width="164" height="44" rx="9" fill="#0077FF" fill-opacity="0.14" stroke="#0077FF" stroke-opacity="0.45" stroke-width="1"/>
    <text x="66" y="114" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#6aabff">Design review</text>
    <rect x="52" y="140" width="164" height="44" rx="9" fill="#ED123B" fill-opacity="0.16" stroke="#ED123B" stroke-opacity="0.55" stroke-width="1.5" filter="url(#glow)"/>
    <text x="66" y="166" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#F793A6">Gym (want 3:00)</text>
    <rect x="52" y="196" width="164" height="44" rx="9" fill="#171717" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="66" y="222" font-family="Inter,sans-serif" font-size="10" fill="#a3a3a3">Standup 3:30</text>
    <rect x="52" y="132" width="164" height="8" rx="4" fill="none" stroke="#ED123B" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="134" y="282" font-family="Inter,sans-serif" font-size="9" fill="#F793A6" text-anchor="middle">No clean slot &#8212; things overlap</text>

    <!-- Column 2: request -->
    <rect x="226" y="64" width="196" height="260" rx="14" fill="#171717" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="246" y="96" width="156" height="52" rx="10" fill="rgba(237,18,59,0.12)" stroke="rgba(237,18,59,0.35)" stroke-width="1"/>
    <text x="258" y="115" font-family="Inter,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.75)">&quot;Fit the gym in after</text>
    <text x="258" y="128" font-family="Inter,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.75)">work without moving</text>
    <text x="258" y="141" font-family="Inter,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.75)">the review.&quot;</text>
    <rect x="246" y="170" width="156" height="36" rx="9" fill="#222222" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="258" y="186" font-family="Inter,sans-serif" font-size="9" fill="#a3a3a3">Plain language &#8212;</text>
    <text x="258" y="199" font-family="Inter,sans-serif" font-size="9" fill="#a3a3a3">not a prompt, not a form</text>

    <!-- Column 3: simulated impact -->
    <rect x="416" y="64" width="196" height="260" rx="14" fill="#111111" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="432" y="92" width="164" height="38" rx="9" fill="rgba(5,163,156,0.12)" stroke="rgba(5,163,156,0.35)" stroke-width="1"/>
    <circle cx="446" cy="111" r="4" fill="#05A39C"/>
    <text x="456" y="108" font-family="Inter,sans-serif" font-size="9.5" font-weight="600" fill="#9EFFFB">Gym placed 3:00</text>
    <text x="456" y="121" font-family="Inter,sans-serif" font-size="8.5" fill="rgba(255,255,255,0.4)">2 tiles shift</text>
    <rect x="432" y="140" width="164" height="38" rx="9" fill="rgba(237,18,59,0.10)" stroke="rgba(237,18,59,0.35)" stroke-width="1"/>
    <circle cx="446" cy="159" r="4" fill="#ED123B"/>
    <text x="456" y="156" font-family="Inter,sans-serif" font-size="9.5" font-weight="600" fill="#F793A6">Standup 3:30 &#8594; 4:00</text>
    <text x="456" y="169" font-family="Inter,sans-serif" font-size="8.5" fill="rgba(255,255,255,0.4)">nothing is cut</text>
    <rect x="432" y="188" width="164" height="38" rx="9" fill="rgba(237,18,59,0.10)" stroke="rgba(237,18,59,0.35)" stroke-width="1"/>
    <circle cx="446" cy="207" r="4" fill="#ED123B"/>
    <text x="456" y="204" font-family="Inter,sans-serif" font-size="9.5" font-weight="600" fill="#F793A6">Drive: 38 &#8594; 22 min</text>
    <text x="456" y="217" font-family="Inter,sans-serif" font-size="8.5" fill="rgba(255,255,255,0.4)">buffer kept</text>

    <!-- Column 4: proposed -->
    <rect x="606" y="64" width="220" height="260" rx="14" fill="#111111" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="622" y="88" width="188" height="32" rx="8" fill="#0077FF" fill-opacity="0.14" stroke="#0077FF" stroke-opacity="0.45" stroke-width="1"/>
    <text x="634" y="108" font-family="Inter,sans-serif" font-size="9.5" font-weight="600" fill="#6aabff">Design review &#183; 1:00</text>
    <rect x="622" y="128" width="188" height="32" rx="8" fill="#05A39C" fill-opacity="0.14" stroke="#05A39C" stroke-opacity="0.5" stroke-width="1"/>
    <text x="634" y="148" font-family="Inter,sans-serif" font-size="9.5" font-weight="600" fill="#3EDCD6">Gym &#183; 3:00</text>
    <rect x="622" y="168" width="188" height="32" rx="8" fill="#ED123B" fill-opacity="0.12" stroke="#ED123B" stroke-opacity="0.45" stroke-width="1"/>
    <text x="634" y="188" font-family="Inter,sans-serif" font-size="9.5" font-weight="600" fill="#F793A6">Standup &#183; 4:00</text>
    <rect x="622" y="248" width="188" height="30" rx="8" fill="#ED123B" fill-opacity="0.15" stroke="#ED123B" stroke-width="1.5"/>
    <text x="716" y="267" font-family="Urbanist,Inter,sans-serif" font-size="11" font-weight="700" fill="#ED123B" text-anchor="middle">Accept plan</text>
    <text x="716" y="300" font-family="Inter,sans-serif" font-size="8.5" fill="#525252" text-anchor="middle">Nothing changes until you accept</text>
  </g>
</svg>