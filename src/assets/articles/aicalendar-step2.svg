<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <clipPath id="clip"><rect width="640" height="320" rx="16"/></clipPath>
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#ED123B" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="640" height="320" fill="url(#bg)"/>

    <!-- Left: before (old state) -->
    <rect x="24" y="24" width="264" height="272" rx="14" fill="#111111" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="44" y="52" font-family="Urbanist,Inter,sans-serif" font-size="11" font-weight="700" fill="#737373">BEFORE</text>
    <line x1="44" y1="64" x2="268" y2="64" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <rect x="44" y="84" width="224" height="34" rx="9" fill="#171717" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="58" y="105" font-family="Inter,sans-serif" font-size="10" fill="#a3a3a3">Client call &#183; 2:00 PM</text>

    <rect x="44" y="130" width="224" height="34" rx="9" fill="#0077FF" fill-opacity="0.14" stroke="#0077FF" stroke-opacity="0.45" stroke-width="1"/>
    <text x="58" y="151" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#6aabff">Standup &#183; 3:30 PM</text>

    <rect x="44" y="176" width="224" height="34" rx="9" fill="#05A39C" fill-opacity="0.14" stroke="#05A39C" stroke-opacity="0.45" stroke-width="1"/>
    <text x="58" y="197" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#3EDCD6">Gym &#183; 5:00 PM</text>

    <text x="44" y="240" font-family="Inter,sans-serif" font-size="9" fill="#525252">Gym lands after a 3&#8211;4 hour</text>
    <text x="44" y="254" font-family="Inter,sans-serif" font-size="9" fill="#525252">drive and a late dinner.</text>

    <!-- Arrow -->
    <circle cx="320" cy="160" r="16" fill="#171717" stroke="#ED123B" stroke-width="1.5"/>
    <text x="320" y="165" font-family="Inter,sans-serif" font-size="12" fill="#ED123B" text-anchor="middle">&#8594;</text>

    <!-- Right: after (new state) -->
    <rect x="352" y="24" width="264" height="272" rx="14" fill="#111111" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="372" y="52" font-family="Urbanist,Inter,sans-serif" font-size="11" font-weight="700" fill="#9EFFFB">AFTER</text>
    <line x1="372" y1="64" x2="596" y2="64" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <rect x="372" y="84" width="224" height="34" rx="9" fill="#171717" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="386" y="105" font-family="Inter,sans-serif" font-size="10" fill="#a3a3a3">Client call &#183; 2:00 PM</text>

    <rect x="372" y="130" width="224" height="34" rx="9" fill="#05A39C" fill-opacity="0.16" stroke="#05A39C" stroke-opacity="0.55" stroke-width="1"/>
    <text x="386" y="151" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#3EDCD6">Gym &#183; 3:00 PM</text>

    <rect x="372" y="176" width="224" height="34" rx="9" fill="#ED123B" fill-opacity="0.14" stroke="#ED123B" stroke-opacity="0.5" stroke-width="1" filter="url(#redGlow)"/>
    <text x="386" y="197" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#F793A6">Standup &#183; 4:00 PM</text>

    <!-- Impact chips -->
    <rect x="372" y="236" width="104" height="24" rx="12" fill="rgba(5,163,156,0.12)" stroke="rgba(5,163,156,0.35)" stroke-width="1"/>
    <text x="424" y="251" font-family="Inter,sans-serif" font-size="8.5" font-weight="600" fill="#9EFFFB" text-anchor="middle">Gym placed</text>

    <rect x="484" y="236" width="92" height="24" rx="12" fill="rgba(237,18,59,0.10)" stroke="rgba(237,18,59,0.35)" stroke-width="1"/>
    <text x="530" y="251" font-family="Inter,sans-serif" font-size="8.5" font-weight="600" fill="#F793A6" text-anchor="middle">Standup +30</text>
  </g>
</svg>